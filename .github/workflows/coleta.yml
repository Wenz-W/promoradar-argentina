name: Coleta de preços AR (6 meses)
on:
  schedule:
    # UTC; Argentina UTC-03: 21:17, 03:17, 09:17 e 15:17.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: promoradar-data
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar biblioteca de criptografia
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Executar testes de regressão
        run: python -m unittest discover -s tests -v
      - name: Coletar ofertas com API oficial
        id: collect
        continue-on-error: true
        env:
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_INITIAL_REFRESH_TOKEN: ${{ secrets.MELI_INITIAL_REFRESH_TOKEN }}
          DATA_FERNET_KEY: ${{ secrets.DATA_FERNET_KEY }}
        run: python -m promoradar collect
      - name: Gerar dashboard público (somente dados e logs)
        if: always()
        run: python -m promoradar render
      - name: Persistir histórico no GitHub
        if: always()
        shell: bash
        run: |
          git config user.name 'PromoRadar Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/real/ docs/index.html docs/runs.csv docs/offers.csv docs/ofertas.json
          if [ -f data/private/meli_oauth.enc ]; then git add -- data/private/meli_oauth.enc; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: registro de coleta $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              sleep 3
              git pull --rebase
            done
            exit 1
          fi
      - name: Preparar GitHub Pages
        if: always()
        uses: actions/configure-pages@v5
      - name: Empacotar painel estático
        if: always()
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Publicar painel na nuvem
        if: always()
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Sinalizar coleta incompleta
        if: always() && steps.collect.outcome != 'success'
        run: |
          echo "Coleta sem sucesso. Verifique dados de execução no dashboard e segredos OAuth." >&2
          exit 1
