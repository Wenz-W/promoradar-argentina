name: Coleta de preços AR (6 meses)
on:
  schedule:
    # UTC; Argentina UTC-03: 21:17, 03:17, 09:17 e 15:17.
    - cron: '17 0,6,12,18 * * *'
  workflow_dispatch:

concurrency:
  group: promoradar-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  coletar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Instalar biblioteca de criptografia
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Executar testes de regressão
        run: python -m unittest discover -s tests -v
      - name: Coletar ofertas com API oficial
        id: collect
        env:
          MELI_CLIENT_ID: ${{ secrets.MELI_CLIENT_ID }}
          MELI_CLIENT_SECRET: ${{ secrets.MELI_CLIENT_SECRET }}
          MELI_INITIAL_REFRESH_TOKEN: ${{ secrets.MELI_INITIAL_REFRESH_TOKEN }}
          DATA_FERNET_KEY: ${{ secrets.DATA_FERNET_KEY }}
        run: python -m promoradar collect
      - name: Gerar dashboard público (somente dados e logs)
        if: always()
        run: python -m promoradar render
      - name: Persistir histórico no GitHub
        if: always()
        shell: bash
        run: |
          git config user.name 'PromoRadar Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/real/ docs/index.html docs/runs.csv docs/offers.csv docs/ofertas.json
          if [ -f data/private/meli_oauth.enc ]; then git add -- data/private/meli_oauth.enc; fi
          if ! git diff --cached --quiet; then
            git commit -m "data: registro de coleta $(date -u +%Y-%m-%dT%H:%MZ)"
            for i in 1 2 3; do
              if git push; then exit 0; fi
              sleep 3
              git pull --rebase
            done
            exit 1
          fi
      - name: Disponibilizar relatórios para o grupo
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: promoradar-relatorios
          path: |
            docs/runs.csv
            docs/offers.csv
            docs/ofertas.json
          retention-days: 30
      - name: Resumo da execução — dados atuais e falhas
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import os
          from pathlib import Path
          report = Path('docs/runs.csv')
          lines = ['## PromoRadar — Resultado da coleta']
          if report.exists():
              with report.open(encoding='utf-8', newline='') as f:
                  rows = list(csv.DictReader(f))
              if rows:
                  last = rows[-1]
                  lines.extend([
                      f"- Estado: **{last.get('status', 'desconhecido')}**",
                      f"- Observações válidas: **{last.get('observations_count', '0')}**",
                      f"- Ofertas detectadas: **{last.get('offers_count', '0')}**",
                      f"- Diagnóstico: {last.get('error', '') or 'Nenhum erro registrado'}",
                  ])
              else:
                  lines.append('- Nenhuma execução registrada.')
          else:
              lines.append('- Relatório indisponível: conferir etapas anteriores.')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('\\n'.join(lines) + '\\n')
          PY
