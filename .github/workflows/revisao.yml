name: Revisar oferta (aprovação humana)
on:
  workflow_dispatch:
    inputs:
      offer_id:
        description: 'ID da oferta (copie a coluna offer_id de docs/offers.csv)'
        required: true
        type: string
      decision:
        description: 'Aprovar ou rejeitar'
        required: true
        type: choice
        options:
          - approved
          - rejected

concurrency:
  group: promoradar-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Instalar dependências do projeto
        run: python -m pip install -r requirements.txt
      - name: Testar integridade
        run: python -m unittest discover -s tests -v
      - name: Aplicar decisão explícita do revisor
        env:
          OFFER_ID: ${{ inputs.offer_id }}
          DECISION: ${{ inputs.decision }}
        run: python -m promoradar review --offer-id "$OFFER_ID" --decision "$DECISION"
      - name: Salvar revisão imutável
        run: |
          git config user.name 'PromoRadar Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- data/real/reviews-*.jsonl docs/ofertas.json
          if ! git diff --cached --quiet; then
            git commit -m 'review: decisão manual de publicação'
            for i in 1 2 3; do
              if git push; then exit 0; fi
              sleep 3
              git pull --rebase
            done
            exit 1
          fi
      - name: Disponibilizar fila aprovada
        uses: actions/upload-artifact@v4
        with:
          name: ofertas-aprovadas
          path: docs/ofertas.json
          retention-days: 30
